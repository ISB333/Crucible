[project]
name = "crucible"
version = "0.0.1"
description = "Verifier-grounded multi-agent search engine (v0)"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
gemini = ["google-generativeai>=0.7"]
inference = ["httpx>=0.27", "requests>=2.31"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-testmon>=2",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
crucible = "crucible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crucible"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures", "examples/integrity_suite/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
    "unit: fast, no external services",
    "integration: needs docker, network, or API keys",
]
asyncio_mode = "auto"
